# The Watchtower in a container, behind the workshop gateway (infra/gateway):
# https://dev-watchtower.workshop.io. Start the gateway first (it creates the `workshop`
# network), then `docker compose up --build` here. No port is published: the gateway is the
# only way in. The workstation (two folders up, F:\Projects) is mounted read-only.
name: watchtower

services:
  watchtower:
    build: .
    image: watchtower:0.1.0
    # Also the DNS name the gateway proxies to (http://watchtower:4321).
    container_name: watchtower
    volumes:
      - type: bind
        source: ../..
        target: /workstation
        read_only: true
      # Logs (ADR-005): the one writable bind mount. A separate path, not nested under the
      # read-only /workstation tree. The same files are visible read-only at
      # /workstation/limforia/logs/watchtower, which the watcher always ignores.
      - type: bind
        source: ../../limforia/logs/watchtower
        target: /var/log/app
        read_only: false
        bind:
          create_host_path: true
    environment:
      LOG_DIR: /var/log/app
      # The gateway's fixed address on the `workshop` network (infra/gateway/compose.yaml).
      # Only that one peer is trusted, besides the container's own loopback (HEALTHCHECK).
      WATCHTOWER_TRUSTED_CLIENTS: 172.30.50.2
      # The public origin: admits its Host header and is the origin for same-origin checks.
      WATCHTOWER_PUBLIC_ORIGIN: https://dev-watchtower.workshop.io
    networks:
      - workshop
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # The healthcheck comes from the image (Dockerfile HEALTHCHECK).

networks:
  workshop:
    external: true
