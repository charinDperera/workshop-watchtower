# Local run of the Watchtower in a container: `docker compose up --build`, then open
# http://localhost:4321/. The workstation (two folders up, F:\Projects) is mounted read-only.
name: watchtower

services:
  watchtower:
    build: .
    image: watchtower:0.1.0
    container_name: watchtower
    # Published on the host's loopback only. Never widen this to 0.0.0.0.
    ports:
      - '127.0.0.1:4321:4321'
    volumes:
      - type: bind
        source: ../..
        target: /workstation
        read_only: true
      # Logs (ADR-005): the one writable bind mount. A separate path, not nested under the
      # read-only /workstation tree. The same files are visible read-only at
      # /workstation/limforia/logs/watchtower, which the watcher always ignores.
      - type: bind
        source: ../../limforia/logs/watchtower
        target: /var/log/app
        read_only: false
        bind:
          create_host_path: true
    environment:
      LOG_DIR: /var/log/app
      # Published-port traffic reaches the container from this network's gateway, not from
      # 192.168.65.x: measured on Docker Desktop 4.95 for Windows (WSL 2), where the server saw
      # its peer as 172.30.43.1 (see README). Only that one address is trusted, besides the
      # container's own loopback (the HEALTHCHECK). Keep it in step with `gateway` below.
      WATCHTOWER_TRUSTED_CLIENTS: 172.30.43.1
    networks:
      - watchtower
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # The healthcheck comes from the image (Dockerfile HEALTHCHECK).

networks:
  watchtower:
    name: watchtower
    ipam:
      config:
        - subnet: 172.30.43.0/28
          gateway: 172.30.43.1
